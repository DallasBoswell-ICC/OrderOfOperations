<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E %3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%23ffffff%22/%3E %3Crect x=%2210%22 y=%2210%22 width=%22492%22 height=%22492%22 rx=%22104%22 fill=%22none%22 stroke=%22%23d5d9de%22 stroke-width=%228%22/%3E %3Cellipse cx=%22208%22 cy=%22296%22 rx=%22128%22 ry=%22146%22 fill=%22none%22 stroke=%22%231f5fbf%22 stroke-width=%2262%22/%3E %3Ctext x=%22402%22 y=%22232%22 text-anchor=%22middle%22 font-family=%22Arial, Helvetica, 'DejaVu Sans', sans-serif%22 font-weight=%22700%22 font-size=%22200%22 fill=%22%231f5fbf%22%3E3%3C/text%3E %3C/svg%3E">
<!-- installing it from the website as an app (Chrome: the install button in the address bar); the manifest and
     icons/ sit next to the page on the site -->
<link rel="manifest" href="print-builder.webmanifest?v=3">
<link rel="apple-touch-icon" href="icons/pb-apple-touch-icon.png">
<meta name="theme-color" content="#1c1d1f">
<style>:root {
  --page: #1b1d20; --bar: #202326; --rib: #232528; --line: #2e3237; --line2: #3a3f45; --card: #25282c;
  --ink: #e8ecf0; --muted: #aab3bb; --faint: #8a939c; --gold: #ffc000; --sel: #2f8cff; --err: #e5484d; --warn: #ffb224; --ok: #46c46a;
  --ui: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--ui); overflow: hidden; }
button { font: inherit; color: inherit; }
.app { height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto; --uiz: 1.15; }
/* the interface's size (Size in the top bar): everything but the sheet scales; the sheet keeps its own zoom */
.top, .ribwrap, .pal, .bot, .dlg { zoom: var(--uiz); }
.top { height: 52px; } .bot { height: 34px; }
.tip { font-size: calc(13px * var(--uiz)) !important; }
.uisz { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); margin-left: 6px; }
.uisz select { background: #26292d; color: #d6dbe0; border: 1px solid var(--line2); border-radius: 8px; padding: 5px 6px; font: inherit; font-size: .85rem; }
/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
.logo { width: 30px; height: 30px; border-radius: 7px; }
h1 { margin: 0; font-size: 1.25rem; font-weight: 700; white-space: nowrap; } h1 span { color: var(--gold); }
.tb-btns { margin-left: auto; display: flex; gap: 6px; }
.btn { border: 1px solid var(--line2); border-radius: 8px; padding: 6px 13px; font-size: .9rem; background: #26292d; cursor: pointer; color: #d6dbe0; }
.btn:hover { background: #30343a; } .btn.icon { padding: 6px 10px; } .btn.primary { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
.menuwrap { position: relative; }
.dmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; display: grid; gap: 2px; padding: 6px; min-width: 220px; background: #26282b; border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,.55); }
.dmenu[hidden] { display: none; }
.dmenu button { text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: .88rem; color: #d6dbe0; display: flex; align-items: center; gap: 10px; }
.dmenu button:hover { background: #34383d; }
.dmenu img { width: 46px; height: 26px; object-fit: contain; background: #f4f5f6; border-radius: 4px; padding: 2px; }
/* ribbon */
.ribbon { display: flex; background: var(--rib); border-bottom: 1px solid var(--line); padding: 6px 8px 0; overflow-x: auto; }
.grp { display: flex; flex-direction: column; border-right: 1px solid #34383d; padding: 0 8px; flex: none; } .grp.last { border-right: 0; }
.grp .row { display: flex; gap: 2px; flex: 1; align-items: center; } .grp .row.col { flex-direction: column; align-items: flex-start; gap: 5px; padding-top: 4px; }
.gl { font-size: 11px; color: var(--faint); text-align: center; padding: 3px 0 5px; white-space: nowrap; }
.rb { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 8px; border-radius: 7px; font-size: 12.5px; color: #d6dbe0; min-width: 50px; background: transparent; border: 0; cursor: pointer; position: relative; }
.rb:hover { background: #2e3236; } .rb[aria-pressed="true"] { background: #3a3524; outline: 1.5px solid var(--gold); }
.rb svg { width: 22px; height: 22px; }
.rb .sw { width: 22px; height: 22px; border-radius: 6px; border: 2.5px solid; background: #2b2e32; }
.chkbtn[aria-pressed="true"] { outline-color: var(--err); background: #3a2426; }
.badge { background: var(--err); color: #fff; font-size: 10.5px; font-weight: 800; border-radius: 9px; padding: 0 6px; margin-left: 4px; } .badge.w { background: var(--warn); color: #111; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #d6dbe0; cursor: pointer; }
.chk input { display: none; } .tog { width: 28px; height: 16px; border-radius: 9px; background: #4a4f55; position: relative; flex: none; }
.tog:after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #ddd; transition: left .12s; }
.chk input:checked + .tog { background: var(--gold); } .chk input:checked + .tog:after { left: 14px; background: #111; }
/* middle */
.mid { display: grid; grid-template-columns: calc(224px * var(--uiz)) 1fr; min-height: 0; }
.pal { background: #1f2124; border-right: 1px solid var(--line); padding: 8px 9px 16px; overflow-y: auto; }
.ph { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 12px 2px 6px; text-transform: uppercase; letter-spacing: .05em; } .ph:first-child { margin-top: 2px; }
.pg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pt { background: #f4f5f6; border-radius: 7px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid transparent; cursor: grab; padding: 2px; user-select: none; touch-action: none; }
.pt:hover { border-color: #9ec5ff; } .pt.on { border-color: var(--sel); box-shadow: 0 0 0 3px rgba(47,140,255,.25); }
.pt svg { width: 52px; height: 30px; overflow: visible; } .pt span { font-size: 9.5px; color: #333; font-weight: 600; text-align: center; line-height: 1.05; }
.desk { background: #3a3d42; position: relative; overflow: hidden; }
.zoomer { position: absolute; inset: 0; overflow: auto; }
.sizer { position: relative; }
.pagehost { position: absolute; left: 24px; top: 24px; transform-origin: 0 0; }
.desk.pan, .desk.pan * { cursor: grab !important; }
.zoombar { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; background: rgba(28,29,31,.88); border: 1px solid var(--line2); border-radius: 8px; padding: 2px; }
.zoombar button { background: transparent; border: 0; border-radius: 6px; min-width: 30px; height: 28px; padding: 0 8px; cursor: pointer; font-weight: 600; }
.zoombar button:hover { background: #3a3e44; } .zoombar span { font-size: .78rem; color: var(--muted); min-width: 3.4em; text-align: center; }
.tip { position: absolute; background: #111; color: #fff; font-size: 13px; padding: 6px 10px; border-radius: 7px; box-shadow: 0 4px 14px rgba(0,0,0,.5); white-space: nowrap; pointer-events: none; z-index: 5; } .tip b { color: #7cc4ff; }
.side { background: #1f2124; border-left: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.card { background: var(--card); border: 1px solid #33373c; border-radius: 10px; padding: 12px; }
.card h4 { margin: 0 0 10px; font-size: 14px; }
.f { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
.in, #props select, #props textarea { width: 100%; background: #1b1d20; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; color: var(--ink); font: inherit; font-size: 13px; }
.in:focus, #props select:focus, #props textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; } .seg button { flex: 1; text-align: center; padding: 5px 0; font-size: 12.5px; background: transparent; border: 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #111; font-weight: 700; }
.ro { color: var(--muted); font-size: 13px; }
.acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; } .acts .btn { font-size: .82rem; padding: 5px 10px; } .btn.del { color: #ff8a8d; }
.help { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0; } .help b { color: var(--ink); } .help kbd { font: inherit; font-size: 11px; background: #33373c; border-radius: 4px; padding: 0 4px; }
.is { display: flex; gap: 8px; font-size: 12.8px; line-height: 1.38; padding: 8px 4px; border-top: 1px solid #33373c; color: #d6dbe0; cursor: pointer; border-radius: 6px; }
.is:first-child { border-top: 0; } .is:hover { background: #2c3035; } .is.okk { cursor: default; } .is.okk:hover { background: transparent; }
.is small { display: block; color: var(--faint); font-size: 11.5px; }
.dot { flex: 0 0 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 900; color: #111; margin-top: 1px; }
.dot.e { background: var(--err); color: #fff; } .dot.w { background: var(--warn); } .dot.ok { background: var(--ok); }
.bot { background: var(--bar); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 12.5px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.tabs { display: flex; gap: 4px; align-self: flex-end; }
.tab { padding: 5px 12px; border-radius: 6px 6px 0 0; border: 1px solid var(--line2); border-bottom: 0; background: transparent; cursor: pointer; color: #d6dbe0; font-size: 12.5px; }
.tab[aria-selected="true"] { background: #3a3d42; color: #fff; font-weight: 600; } .tab .x { margin-left: 6px; color: var(--faint); } .tab .x:hover { color: #ff8a8d; }
.hint { margin-left: auto; color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
/* the page (as it prints) */
.pr-page { width: 8.5in; height: 11in; position: relative; background: #fff; color: #000; font-family: "Liberation Sans", Arial, Helvetica, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
.pr-page.land { width: 11in; height: 8.5in; }
.pr-frame { position: absolute; inset: .4in; border: 2px solid #000; display: flex; flex-direction: column; }
.pr-draw { flex: 1 1 0; display: flex; padding: .12in; min-height: 0; }
.pr-draw > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pr-draw text { fill: #000; stroke: none; } .pr-draw text[paint-order] { stroke: #fff; } .pr-draw text { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; }
.pr-tb { border-top: 2px solid #000; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 1px; background: #000; font-size: 8pt; }
.tbf { background: #fff; padding: 3px 6px 4px; min-width: 0; }
.pr-tb .k { font-size: 6pt; text-transform: uppercase; letter-spacing: .06em; color: #333; }
.pr-tb .v { font-size: 10pt; font-weight: 700; margin-top: 1px; min-height: 13pt; overflow-wrap: anywhere; } .pr-tb .big .v { font-size: 13pt; }
.pr-tb > .notes { grid-column: 1 / -1; background: #fff; padding: 3px 6px 4px; display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 7pt; }
.pr-tb > .notes .k { margin-right: 6px; }
.pr-tb { overflow: hidden; }
/* editor marks (never printed) */
#sv { touch-action: none; }
#sv.tool-wire, #sv.tool-rung, #sv.tool-place, #sv.tool-note { cursor: crosshair; }
/* title block dialog */
.dlg { background: #232528; color: var(--ink); border: 1px solid var(--line2); border-radius: 12px; padding: 18px 20px; width: min(760px, 94vw); }
.dlg::backdrop { background: rgba(0,0,0,.55); }
.dlg h3 { margin: 0 0 4px; } .dlg .sub { margin: 0 0 12px; font-size: 13px; color: var(--muted); } .dlg code { background: #33373c; border-radius: 4px; padding: 0 4px; }
.tbrows { display: grid; gap: 6px; margin-bottom: 10px; max-height: 46vh; overflow-y: auto; }
.tbrow { display: grid; grid-template-columns: 28px 1fr 1.4fr 74px 58px 28px 28px 28px; gap: 6px; align-items: center; }
.tbrow input[type=text], .tbrow select, .dlg textarea { background: #1b1d20; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; color: var(--ink); font: inherit; font-size: 13px; width: 100%; }
.tbrow .ib { background: #2b2e32; border: 1px solid var(--line2); border-radius: 6px; height: 30px; cursor: pointer; }
.tbrow .ib:hover { background: #363a40; } .tbrow .num { color: var(--faint); font-size: 12px; text-align: center; }
.tbrow label { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.tbhead { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.notes-row { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 12px 0 6px; }
.dlg-foot { display: flex; justify-content: space-between; margin-top: 14px; }
#print-host { display: none; }
@media print {
  body { overflow: visible; background: #fff; }
  .app, dialog { display: none !important; }
  #print-host { display: block; }
  #print-host .pr-page { box-shadow: none; page-break-after: always; break-after: page; }
  #print-host .pr-page { page: port; } #print-host .pr-page.land { page: land; }
}
/* the Edit group: small buttons, two to a column */
.stk { display: flex; flex-direction: column; gap: 2px; }
.rb.sm { flex-direction: row; gap: 6px; min-width: 76px; padding: 3px 8px; justify-content: flex-start; }
.rb.sm svg { width: 17px; height: 17px; }
.rb.sm.danger:hover { color: #ff8a8d; }
.rb:disabled { opacity: .38; cursor: default; background: transparent; }
/* no page text highlighted by dragging on the sheet */
.desk, .desk * { -webkit-user-select: none; user-select: none; }
/* over a terminal in Select: a drag draws a wire */
#sv.tool-select.on-term { cursor: crosshair; }

/* the ribbon's tabs: Home, the gold Part tab (what is picked; as in Circuit Builder), Check Print */
.ribwrap { background: var(--rib); border-bottom: 1px solid var(--line); min-width: 0; }
.ribwrap .ribbon { border-bottom: 0; min-height: 92px; }
.rtabs { display: flex; gap: 2px; padding: 5px 10px 0; background: #191b1e; }
.rtab { background: transparent; border: 0; color: #aab1b9; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 16px 7px; border-radius: 7px 7px 0 0; cursor: pointer; display: flex; align-items: center; }
.rtab:hover { color: #fff; } .rtab[aria-pressed="true"] { background: var(--rib); color: #fff; }
.rtab.gold { background: #3a3220; color: var(--gold); } .rtab.gold[aria-pressed="true"] { background: var(--gold); color: #141414; }
.ribwrap:has(#rt-part[aria-pressed="true"]) .ribbon.part { box-shadow: inset 0 3px 0 var(--gold); }
/* a part's settings across the ribbon: each a label over its box */
#props { display: flex; align-items: flex-start; gap: 18px; padding: 10px 8px 8px; flex-wrap: nowrap; }
#props h4 { display: none; }
#props .f { display: flex; flex-direction: column; align-items: stretch; gap: 5px; margin: 0; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); flex: none; }
#props .f > * { text-transform: none; letter-spacing: 0; }
#props .f .in, #props .f select { min-width: 130px; font-size: 14px; padding: 7px 9px; }
#props .f .seg { min-width: 120px; } #props .f .seg button { padding: 7px 12px; font-size: 13px; }
#props .f .ro { font-size: 14px; color: var(--ink); padding: 7px 0; white-space: nowrap; }
#props .help { max-width: 300px; font-size: 12px; align-self: center; }
#props .acts { margin: 0; align-self: flex-end; flex-wrap: nowrap; padding-bottom: 1px; }
#props .acts .btn { font-size: 13px; padding: 7px 12px; }
#props textarea { width: 300px; min-height: 58px; }
/* Check Print's findings across the ribbon */
.chips { display: flex; gap: 8px; padding: 8px; overflow-x: auto; align-items: stretch; }
.chips .is { flex: none; width: 250px; background: #26292d; border: 1px solid #34383d; border-radius: 8px; padding: 7px 9px; }
.chips .is:first-child { border-top: 1px solid #34383d; }
.ribwrap [hidden] { display: none !important; }

/* the ribbon scrolls sideways when the interface is too big for the window */
.ribwrap .ribbon { overflow-x: auto; overflow-y: hidden; }

/* Save, and the file that is open */
.split { display: flex; } .split #save-btn { border-radius: 8px 0 0 8px; } .split .more { border-radius: 0 8px 8px 0; border-left: 0; padding: 6px 8px; }
#save-menu { left: auto; right: 0; } #save-menu .k { color: var(--faint); font-size: .8em; margin-left: 10px; }
.file-label { font-size: .85rem; color: var(--muted); background: #26292d; border: 1px solid var(--line2); border-radius: 999px; padding: 3px 11px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-label.dirty { color: var(--gold); border-color: #5a4a14; }
#save-menu button { white-space: nowrap; }
</style>
<style id="print-page"></style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <img class="logo" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E %3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%23ffffff%22/%3E %3Crect x=%2210%22 y=%2210%22 width=%22492%22 height=%22492%22 rx=%22104%22 fill=%22none%22 stroke=%22%23d5d9de%22 stroke-width=%228%22/%3E %3Cellipse cx=%22208%22 cy=%22296%22 rx=%22128%22 ry=%22146%22 fill=%22none%22 stroke=%22%231f5fbf%22 stroke-width=%2262%22/%3E %3Ctext x=%22402%22 y=%22232%22 text-anchor=%22middle%22 font-family=%22Arial, Helvetica, 'DejaVu Sans', sans-serif%22 font-weight=%22700%22 font-size=%22200%22 fill=%22%231f5fbf%22%3E3%3C/text%3E %3C/svg%3E" alt="O³">
    <h1>Order of Operations: <span>Print Builder</span></h1>
    <span class="file-label" id="file-label" hidden></span>
    <div class="tb-btns">
      <div class="menuwrap"><button class="btn" id="new-btn" aria-haspopup="menu">New ▾</button>
        <div class="dmenu" id="new-menu" hidden>
          <button data-new="blank">Blank Ladder</button>
          <button data-new="starter">Example: Motor Starter</button>
                  </div></div>
      <button class="btn" id="open-btn">Open</button>
      <div class="menuwrap split"><button class="btn" id="save-btn">Save</button><button class="btn more" id="save-more" title="More ways to save" aria-haspopup="menu">▾</button>
        <div class="dmenu" id="save-menu" hidden><button id="saveas-btn">Save As a new file… <span class="k">Ctrl+Shift+S</span></button></div></div>
      <button class="btn" id="print-btn">Print</button>
      <label class="uisz" title="How big the buttons, menus and writing are (the sheet has its own zoom)">Size
        <select id="ui-size"><option value="1">Small</option><option value="1.15" selected>Medium</option><option value="1.3">Large</option><option value="1.5">Extra Large</option></select></label>
      <button class="btn icon" id="undo-btn" title="Undo (Ctrl+Z)">↶</button>
      <button class="btn icon" id="redo-btn" title="Redo (Ctrl+Y)">↷</button>
    </div>
  </header>
  <div class="ribwrap">
  <div class="rtabs" role="tablist">
    <button class="rtab" id="rt-home" role="tab" aria-pressed="true">Home</button>
    <button class="rtab gold" id="rt-part" role="tab" aria-pressed="false" hidden>Part</button>
    <button class="rtab" id="rt-check" role="tab" aria-pressed="false">Check Print<span class="badge" id="tab-badge" hidden></span></button>
  </div>
  <nav class="ribbon" id="ribbon">
    <div class="grp"><div class="row">
      <div class="stk">
        <button class="rb sm" id="paste-btn" title="Paste a copy where the pointer is, with numbers of its own (Ctrl+V)"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 5.5H5.5v15h13v-15H17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Paste</span></button>
        <button class="rb sm" id="copy-btn" title="Copy the picked symbols and the wires between them (Ctrl+C)"><svg viewBox="0 0 24 24"><path d="M8 8h11v12H8zM5 16V4h11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Copy</span></button>
      </div><div class="stk">
        <button class="rb sm" id="cut-btn" title="Cut the picked symbols and wires (Ctrl+X)"><svg viewBox="0 0 24 24"><path d="M6 7a2.5 2.5 0 1 0 0 .01M6 17a2.5 2.5 0 1 0 0 .01M8 8.5l11 9M8 15.5l11-9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Cut</span></button>
        <button class="rb sm danger" id="del-btn" title="Delete what is picked (Delete key)"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Delete</span></button>
      </div>
    </div><div class="gl">Edit</div></div>
    <div class="grp"><div class="row" id="tools">

/* ---------- taking away ---------- */

/* ---------- tags ---------- */

/* ---------- undo ---------- */
const UNDO = [], REDO = [];

function redo() { if (!REDO.length) return false; UNDO.push(JSON.stringify(doc)); doc = JSON.parse(REDO.pop()); S = doc.sheets[Math.min(doc.cur, doc.sheets.length - 1)]; return true; }

/* ---------- building by hand (templates, tests) ---------- */

  const a = endAt(s, ...pts[0]) || loose(pts[0]);

/* ---- js/nets.js ---- */
/* =====================================================================

   Joined: a wire's two ends; terminals and nodes at the same spot; every rail of the same name (L1 on any sheet
   is one wire); every line-in arrow of the same name. Not joined: wires that only cross.

     first motor), T4-T6 (the second)..., lettered again past each overload (T1, T1A).

/* ---- js/check.js ---- */
/* =====================================================================

    if (!parts.some(y => y.p.t === other && y.p.tag === x.p.tag)) add('w', `Continuation ${x.p.tag} goes nowhere`, x.p.t === 'cnt_out' ? `Put a “Continued From” arrow lettered ${x.p.tag} where the wire picks up again (on the next sheet).` : `Nothing continues to ${x.p.tag}: put a “Continues To” arrow lettered ${x.p.tag} where the wire leaves off.`, [pk(x)]); }

    for (let i = 0; i < termsN(x.p); i++) { const r = A.rootT(x.p, x.s, i); if (!WIRED.has(r) && (TERMS.get(r) || []).length < 2 && !(x.p.t === 'sup')) loose.push(i); }

    { open++; add('e', `A wire ends without reaching anything${sheetName(k)}`, 'Its loose end is ringed: join it to a terminal, a rail or another wire.', [{ k, id: n.id, x: n.x, y: n.y }]); } });

    for (const x of parts) if (PASS.has(kindOf(x.p)) && termsN(x.p) === 2) { const a = A.rootT(x.p, x.s, 0), b = A.rootT(x.p, x.s, 1); add2(a, b, x); add2(b, a, x); }

    if (prev.has(A.n2)) { shorts++; const path = []; for (let r = A.n2; prev.get(r); r = prev.get(r)[0]) path.push(prev.get(r)[1]);

  }

  for (const [r, ts] of TERMS) if (r !== A.n1 && r !== A.n2 && ts.length >= 2 && ts.every(t => isLoadKind(kindOf(t.p)))) {
    const ps = [...new Set(ts.map(t => t.p))]; if (ps.length >= 2) add('w', `${ps.map(name).join(' and ')} are in series`, 'Loads in series share the voltage, so neither gets enough. Put each across 1 and 2 (in parallel).', ts.map(t => ({ k: t.k, id: t.p.id, x: t.p.x, y: t.p.y })));
  }

    if (l === '?') { add('w', `${rs.length} power wire${rs.length > 1 ? 's' : ''} could not be numbered`, 'Not reached from a line in (L1, L2, L3) through the disconnect, fuses and starters.', rs.map(r => { const o = WIRED.get(r)[0], P = wirePts(o.s, o.w); return { k: o.k, id: o.w.id, x: P[0][0], y: P[0][1] }; })); continue; }
    if (rs.length > 1) { dupN++; add('e', `Wire number ${l} is used twice`, 'Two wires that are not joined have the same number. Change one (or clear the number you typed).', rs.map(r => { const o = WIRED.get(r)[0], P = wirePts(o.s, o.w); return { k: o.k, id: o.w.id, x: P[0][0], y: P[0][1] }; })); }
  }
  const okLine = (t, d) => out.push({ sev: 'ok', title: t, detail: d, at: [] });
  if (!open) okLine('Everything is wired', 'No loose terminals or wire ends.');
  if (!shorts && (A.n1 != null || parts.length)) okLine('No shorts', 'Every way from 1 to 2 goes through a load.');
  if (!dups) okLine('Every device has its own tag', 'Contacts share only their coil’s.');
  if (!dupN) okLine('No wire number is used twice', '');

}

/* ---- js/render.js ---- */

      <div class="acts"><button class="btn del" id="p-del">Delete</button></div>`;
    $('note-text').addEventListener('input', e => edit(() => { t.s = e.target.value; }));
    for (const b of P.querySelectorAll('[data-size]')) b.addEventListener('click', () => { snapshot(); t.size = +b.dataset.size; refresh(); });
    for (const b of P.querySelectorAll('[data-bold]')) b.addEventListener('click', () => { snapshot(); t.bold = b.dataset.bold === '1'; refresh(); });
  } else if (w) {
    const r = A.wireRoot(S, w), auto = A.label.get(r), net = (A.WIRED.get(r) || []).length;
    P.innerHTML = `<h4>Wire ${esc(auto || '')}</h4>
      <div class="f">Number<input class="in" id="w-num" value="${esc(w.num || '')}" placeholder="${esc(w.num ? '' : auto || '')} (automatic)"></div>
      <p class="help">${net > 1 ? `${net} wire pieces are joined here; they all take this number.` : 'Numbered automatically.'} Type a number to fix it yourself; clear it to go back to automatic.</p>
      <div class="f">On the Print<div class="seg"><button data-wshow="1" aria-pressed="${!w.hideNum}">Shown</button><button data-wshow="0" aria-pressed="${!!w.hideNum}">Hidden</button></div></div>
      <p class="help">Drag the number on the sheet to move it.${w.lab ? '' : ' It finds a clear spot by itself until you do.'}</p>
      <div class="acts">${w.lab ? '<button class="btn" id="w-auto">Put Number Back</button>' : ''}<button class="btn del" id="p-del">Delete Wire</button></div>`;
    for (const b of P.querySelectorAll('[data-wshow]')) b.addEventListener('click', () => { snapshot(); const hide = b.dataset.wshow === '0'; for (const o of runWires(w)) { if (hide) o.hideNum = true; else delete o.hideNum; } refresh(); });
    const wa = $('w-auto'); if (wa) wa.addEventListener('click', () => { snapshot(); for (const o of runWires(w)) delete o.lab; refresh(); });
    $('w-num').addEventListener('input', e => edit(() => { const v = e.target.value.trim().toUpperCase(); for (const o of A.WIRED.get(r) || []) delete o.w.num; if (v) w.num = v; }));
  } else if (ids.length > 1) {
    P.innerHTML = `<h4>${ids.length} things picked</h4><p class="help">Drag any of them to move them together. <kbd>R</kbd> turns the symbols; <kbd>Delete</kbd> deletes them all.</p><div class="acts"><button class="btn del" id="p-del">Delete</button></div>`;
  } else {
    P.innerHTML = `<h4>Drawing the Print</h4><p class="help"><b>1.</b> Drag a symbol from the left onto a rung: it goes into the wire.<br><b>2.</b> <b>Rung</b> adds a rung between the rails; <b>Wire</b> draws branches and the power circuit.<br><b>3.</b> Pick a symbol to set its number or letter, NO/NC, what works it, and its label.<br><b>4.</b> Wire numbers, rung numbers and cross-references fill in by themselves.<br><b>5.</b> <b>Check Print</b> rings what needs fixing.</p>`;
  }
  const del = $('p-del'); if (del) del.addEventListener('click', removeSelection);
}
function removeSelection() {
  if (!sel.size && !selW) return;
  snapshot();
  for (const id of sel) { if (partOf(S, id)) removePart(S, id); else if (nodeOf(S, id)) { S.wires = S.wires.filter(w => !(w.a.n === id || w.b.n === id)); S.nodes = S.nodes.filter(n => n.id !== id); tidy(S); } else S.texts = S.texts.filter(t => t.id !== id); }
  if (selW) removeWire(S, selW);
  sel = new Set(); selW = null; refresh();
}

/* ---------- Check Print ---------- */
function renderChecks() {
  $('check-list').innerHTML = ISSUES.map((is, i) => `<div class="is${is.sev === 'ok' ? ' okk' : ''}" data-i="${i}"><span class="dot ${is.sev}">${is.sev === 'e' ? '!' : is.sev === 'w' ? '?' : '✓'}</span><div>${esc(is.title)}${is.detail ? `<small>${esc(is.detail)}</small>` : ''}</div></div>`).join('');
  for (const el of document.querySelectorAll('.is[data-i]')) el.addEventListener('click', () => {
    const is = ISSUES[+el.dataset.i]; if (!is.at.length) return;
    checkOn = true; const a = is.at[0]; if (a.k !== doc.cur) { doc.cur = a.k; }
    S = doc.sheets[doc.cur]; sel = new Set(is.at.filter(x => x.k === doc.cur && (partOf(S, x.id) || nodeOf(S, x.id))).map(x => x.id));
    selW = is.at.find(x => S.wires.some(w => w.id === x.id))?.id || null;
    keepTab = true; refresh(); keepTab = false; showPoint(a.x, a.y);
  });
}
// the view scrolled to put a point on the sheet in the middle
function showPoint(x, y) { const r = svg.getBoundingClientRect(), m = svg.getScreenCTM(), sx = m.a * x + m.e, sy = m.d * y + m.f, dr = zoomer.getBoundingClientRect();
  zoomer.scrollLeft += sx - (dr.left + dr.width / 2); zoomer.scrollTop += sy - (dr.top + dr.height / 2); }

/* ---------- sheets ---------- */
function renderTabs() {
  $('tabs').innerHTML = doc.sheets.map((s, k) => `<button class="tab" data-k="${k}" aria-selected="${k === doc.cur}">Sheet ${k + 1}${doc.sheets.length > 1 && k === doc.cur ? '<span class="x" data-del="1" title="Take this sheet away">×</span>' : ''}</button>`).join('');
  for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', e => {
    const k = +b.dataset.k;
    if (e.target.dataset.del) { if (!confirm(`Take Sheet ${k + 1} away, and everything on it?`)) return; snapshot(); doc.sheets.splice(k, 1); doc.cur = Math.max(0, Math.min(doc.cur, doc.sheets.length - 1)); }
    else doc.cur = k;
    sel = new Set(); selW = null; refresh(); fitZoom();
  });
}
$('addsheet-btn').addEventListener('click', () => { snapshot(); doc.sheets.push(newSheet(true, S.land)); doc.cur = doc.sheets.length - 1; sel = new Set(); selW = null; refresh(); fitZoom(); });
$('orient-btn').addEventListener('click', () => {
  snapshot(); S.land = !S.land;
  // (an empty sheet: its rails laid out afresh for the new way round; otherwise kept on the paper)
  const rails = S.parts.filter(p => p.t === 'rail');
  if (rails.length === S.parts.length && !S.wires.length && !S.texts.length) { const f = newSheet(true, S.land); S.parts = f.parts; }
  refresh(true);
  for (const r of S.parts) if (r.t === 'rail') { r.y1 = Math.min(r.y1, snap(VB[1] - 60)); r.y0 = Math.min(r.y0, r.y1 - 200); r.x = Math.min(r.x, snap(VB[0] - 60)); }
  refresh(); fitZoom();
});

/* ---------- the title block ---------- */
function renderTB() {
  const f = doc.tb.fields;
  $('tb-rows').innerHTML = `<div class="tbrow tbhead"><span></span><span>Label</span><span>What it says</span><span>Width</span><span>Large</span><span></span><span></span><span></span></div>` + f.map((x, i) => `<div class="tbrow" data-i="${i}">
    <span class="num">${i + 1}</span><input type="text" data-k="label" value="${esc(x.label)}"><input type="text" data-k="value" value="${esc(x.value)}">
    <select data-k="span">${[1, 2, 3, 4, 5, 6, 8, 12].map(n => `<option value="${n}"${(x.span || 2) === n ? ' selected' : ''}>${n}/12</option>`).join('')}</select>
    <label><input type="checkbox" data-k="big"${x.big ? ' checked' : ''}>big</label>
    <button class="ib" data-mv="-1" title="Earlier"${i ? '' : ' disabled'}>↑</button><button class="ib" data-mv="1" title="Later"${i < f.length - 1 ? '' : ' disabled'}>↓</button><button class="ib" data-rm="1" title="Take this box away">✕</button></div>`).join('');
  $('tb-shownotes').checked = !!doc.tb.showNotes; $('tb-notes').value = doc.tb.notes || '';
  for (const r of document.querySelectorAll('.tbrow[data-i]')) { const i = +r.dataset.i;
    for (const el of r.querySelectorAll('[data-k]')) el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => { const x = f[i]; const k = el.dataset.k; x[k] = k === 'span' ? +el.value : k === 'big' ? el.checked : el.value; refresh(true); });
    for (const b of r.querySelectorAll('[data-mv]')) b.addEventListener('click', () => { const j = i + +b.dataset.mv; [f[i], f[j]] = [f[j], f[i]]; renderTB(); refresh(true); });
    r.querySelector('[data-rm]').addEventListener('click', () => { f.splice(i, 1); renderTB(); refresh(true); }); }
}
$('tb-btn').addEventListener('click', () => { snapshot(); renderTB(); $('tb-dlg').showModal(); });
$('tb-add').addEventListener('click', () => { doc.tb.fields.push({ id: uid('f'), label: 'New Box', value: '', span: 3 }); renderTB(); refresh(true); const r = document.querySelectorAll('.tbrow[data-i]'); r[r.length - 1].querySelector('input').select(); });
$('tb-shownotes').addEventListener('change', e => { doc.tb.showNotes = e.target.checked; refresh(true); });
$('tb-notes').addEventListener('input', e => { doc.tb.notes = e.target.value; refresh(true); });
$('tb-reset').addEventListener('click', () => { doc.tb = defaultTB(); renderTB(); refresh(true); });
$('tb-done').addEventListener('click', () => $('tb-dlg').close());

/* ---------- zoom and panning ---------- */
const pageSize = () => S.land ? [1056, 816] : [816, 1056];
// the room round the page: enough to bring any part of it (its edges too) to the middle of the window, so zooming
// about the pointer never runs out of room (Fit puts the page back in the middle)
const padX = () => zoomer.clientWidth * .6, padY = () => zoomer.clientHeight * .6;
function applyZoom() { const [w, h] = pageSize(), px = padX(), py = padY();
  host.style.transform = `scale(${zoom})`; host.style.left = px + 'px'; host.style.top = py + 'px';
  sizer.style.width = (w * zoom + 2 * px) + 'px'; sizer.style.height = (h * zoom + 2 * py) + 'px'; $('z-lvl').textContent = Math.round(zoom * 100) + '%'; }
function fitZoom() { const [w, h] = pageSize(); zoom = Math.max(.2, Math.min(3, Math.min((zoomer.clientWidth - 48) / w, (zoomer.clientHeight - 48) / h))); applyZoom();
  zoomer.scrollLeft = padX() + w * zoom / 2 - zoomer.clientWidth / 2; zoomer.scrollTop = padY() + h * zoom / 2 - zoomer.clientHeight / 2; }
// zoomed by f about a point on the screen (the pointer; else the middle): that point stays where it is
function zoomBy(f, cx, cy) {
  const r = zoomer.getBoundingClientRect(); cx = cx ?? r.left + r.width / 2; cy = cy ?? r.top + r.height / 2;
  const qx = (zoomer.scrollLeft + cx - r.left - padX()) / zoom, qy = (zoomer.scrollTop + cy - r.top - padY()) / zoom;
  zoom = Math.max(.2, Math.min(4, zoom * f)); applyZoom();
  zoomer.scrollLeft = qx * zoom + padX() - (cx - r.left); zoomer.scrollTop = qy * zoom + padY() - (cy - r.top);
}
$('z-in').addEventListener('click', () => zoomBy(1.25)); $('z-out').addEventListener('click', () => zoomBy(.8)); $('z-fit').addEventListener('click', fitZoom);
zoomer.addEventListener('wheel', e => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
function startPan(e) { e.preventDefault(); pan = { x: e.clientX, y: e.clientY, l: zoomer.scrollLeft, t: zoomer.scrollTop }; desk.classList.add('pan'); svg.setPointerCapture(e.pointerId); }
function doPan(e) { zoomer.scrollLeft = pan.l - (e.clientX - pan.x); zoomer.scrollTop = pan.t - (e.clientY - pan.y); }
window.addEventListener('resize', () => { if (svg) { VB = fitDraw(host.firstElementChild); drawEd(); } });

/* ---------- files ---------- */
let saveT = null;
function autosave() { showFileLabel(); clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(AUTOSAVE, JSON.stringify(doc)); localStorage.setItem(SHOWKEY, JSON.stringify(SHOW)); } catch (_) {} }, 400); }
function loadDoc(d) {
  if (!d || d.kind !== 'o3-print' || !Array.isArray(d.sheets) || !d.sheets.length) throw new Error('not a Print Builder file');
  for (const s of d.sheets) { s.parts ||= []; s.wires ||= []; s.nodes ||= []; s.texts ||= []; for (const p of s.parts) if (p.t !== 'rail' && !LIB[p.t]) throw new Error('unknown symbol ' + p.t); }
  d.tb ||= defaultTB(); d.cur = Math.min(d.cur || 0, d.sheets.length - 1);
  doc = d; S = doc.sheets[doc.cur]; sel = new Set(); selW = null; UNDO.length = 0; REDO.length = 0;
  // (a fused disconnect from before its fuses were numbered: the next three numbers)
  for (const s of d.sheets) for (const p of s.parts) if (p.t === 'fdsc3' && !p.fu) p.fu = nextTag('FU');
}
const fileName = () => ((doc.tb.fields.find(f => /title/i.test(f.label)) || {}).value || 'Print').replace(/[\\/:*?"<>|]+/g, '').trim() || 'Print';
/* ---------- files, as in Circuit Builder: where the browser allows it (Chrome and Edge, and the installed app), the
   print keeps hold of the file it was opened from or first saved to, and Save writes straight back into that file;
   Save As makes a new one. Elsewhere Save hands over a new copy to download. ---------- */
let fileHandle = null, savedJSON = null;
const FILE_TYPES = [{ description: 'Print Builder print', accept: { 'application/json': ['.json'] } }];
const canUseFiles = () => typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function' && window.self === window.top;
const docJSON = () => JSON.stringify(doc);
function markSaved() { savedJSON = docJSON(); showFileLabel(); }
function forgetFile() { fileHandle = null; savedJSON = null; showFileLabel(); }
function showFileLabel() {
  const lab = $('file-label'), dirty = !!fileHandle && savedJSON !== null && docJSON() !== savedJSON;
  lab.hidden = !fileHandle; lab.textContent = fileHandle ? (dirty ? '● ' : '') + fileHandle.name : ''; lab.classList.toggle('dirty', dirty);
  lab.title = fileHandle ? (dirty ? 'Changes not saved yet: Save (Ctrl+S) writes them into ' : 'Everything is saved in ') + fileHandle.name : '';
  $('save-btn').title = fileHandle ? `Save into ${fileHandle.name} (Ctrl+S)` : 'Save this print as a file (Ctrl+S)';
}
function downloadCopy() {
  const b = new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = fileName() + '.o3print.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  return 'Saved to your Downloads as ' + a.download + '. (This browser saves a new copy each time; Chrome or Edge save back into the same file.)';
}
async function saveToFile(asNew) {
  if (!canUseFiles()) return downloadCopy();
  try {
    if (!fileHandle || asNew) fileHandle = await window.showSaveFilePicker({ suggestedName: fileName() + '.o3print.json', types: FILE_TYPES });
    const w = await fileHandle.createWritable(); await w.write(JSON.stringify(doc, null, 1)); await w.close();
    markSaved(); return 'Saved into ' + fileHandle.name + '.';
  } catch (e) {
    if (e && e.name === 'AbortError') return 'Not saved.';
    if (e && (e.name === 'SecurityError' || e.name === 'NotAllowedError')) return downloadCopy();
    return 'Could not save: ' + (e && e.message || e);
  }
}
async function openFile(f, handle) {
  try { const d = JSON.parse(await f.text()); snapshot(); const keep = UNDO.slice(); loadDoc(d); UNDO.push(...keep); fileHandle = handle || null; refresh(true); fitZoom(); markSaved(); say('Opened ' + f.name + (handle ? '. Save writes your changes back into it.' : '')); }
  catch (err) { alert('That file could not be opened: it is not a Print Builder file (' + err.message + ').'); }
}
async function pickAndOpen() {
  if (canUseFiles()) {
    try { const [h] = await window.showOpenFilePicker({ types: FILE_TYPES }); await openFile(await h.getFile(), h); return; }
    catch (e) { if (e && e.name === 'AbortError') return; if (!(e && (e.name === 'SecurityError' || e.name === 'NotAllowedError'))) { alert('Could not open: ' + (e.message || e)); return; } }
  }
  $('file-in').click();
}
$('save-btn').addEventListener('click', async () => say(await saveToFile(false)));
$('saveas-btn').addEventListener('click', async e => { e.stopPropagation(); closeMenus(); say(await saveToFile(true)); });
$('save-more').addEventListener('click', e => { e.stopPropagation(); const m = $('save-menu'), o = m.hidden; closeMenus(); m.hidden = !o; });
$('open-btn').addEventListener('click', pickAndOpen);
$('file-in').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) openFile(f, null); });
$('new-btn').addEventListener('click', e => { e.stopPropagation(); const m = $('new-menu'), o = m.hidden; closeMenus(); m.hidden = !o; });
for (const b of document.querySelectorAll('[data-new]')) b.addEventListener('click', () => { closeMenus(); snapshot(); const keep = UNDO.slice(); loadDoc(template(b.dataset.new)); UNDO.push(...keep); forgetFile(); refresh(true); fitZoom(); });

/* ---------- printing: every sheet, each on its own page the right way round ---------- */
function printAll() {
  const ph = $('print-host');
  ph.innerHTML = doc.sheets.map((s, k) => pageHTML(s, k, A)).join('');
  ph.style.cssText = 'display:block;position:fixed;left:-30000px;top:0';
  for (const p of ph.querySelectorAll('.pr-page')) fitDraw(p);
  ph.style.cssText = '';
  $('print-page').textContent = '@page port { size: 8.5in 11in; margin: 0; } @page land { size: 11in 8.5in; margin: 0; } @page { margin: 0; }';
  setTimeout(() => window.print(), 30);
}
window.addEventListener('afterprint', () => { $('print-host').innerHTML = ''; });
$('print-btn').addEventListener('click', printAll);

/* ---------- the ribbon's other buttons, and the keyboard ---------- */
for (const b of document.querySelectorAll('[data-tool]')) b.addEventListener('click', () => setTool(b.dataset.tool));
$('check-btn').addEventListener('click', () => { checkOn = true; setRib('check'); updateButtons(); drawEd(); });
$('ring-chk').addEventListener('change', e => { checkOn = e.target.checked; updateButtons(); drawEd(); });
$('rt-home').addEventListener('click', () => setRib('home')); $('rt-part').addEventListener('click', () => setRib('part'));
$('rt-check').addEventListener('click', () => { checkOn = true; setRib('check'); updateButtons(); drawEd(); });
$('copy-btn').addEventListener('click', copySel); $('cut-btn').addEventListener('click', cutSel); $('paste-btn').addEventListener('click', () => pasteClip(null)); $('del-btn').addEventListener('click', removeSelection);
$('undo-btn').addEventListener('click', () => { if (undo()) { sel = new Set(); selW = null; refresh(true); } });
$('redo-btn').addEventListener('click', () => { if (redo()) { sel = new Set(); selW = null; refresh(true); } });
for (const [id, k] of [['show-wn', 'wn'], ['show-rn', 'rn'], ['show-xr', 'xr']]) $(id).addEventListener('change', e => { SHOW[k] = e.target.checked; refresh(); });
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $('tb-dlg').open;
  if ((e.ctrlKey || e.metaKey) && !typing) {
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); $('undo-btn').click(); return; }
    if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); $('redo-btn').click(); return; }
    if (k === 's') { e.preventDefault(); (async () => say(await saveToFile(e.shiftKey)))(); return; }
    if (k === 'p') { e.preventDefault(); printAll(); return; }
    if (k === 'c') { e.preventDefault(); copySel(); return; }
    if (k === 'x') { e.preventDefault(); cutSel(); return; }
    if (k === 'v') { e.preventDefault(); pasteClip(cursor); return; }
    if (k === 'd') { e.preventDefault(); if (copySel()) pasteClip(null); return; }
    if (k === 'a') { e.preventDefault(); sel = new Set([...S.parts, ...S.texts].map(x => x.id)); selW = null; refresh(); return; }
    if (k === '0') { e.preventDefault(); fitZoom(); return; }
    if (k === '=' || k === '+') { e.preventDefault(); zoomBy(1.25); return; }
    if (k === '-') { e.preventDefault(); zoomBy(.8); return; }
    return;
  }
  if (typing) return;
  if (e.key === ' ') { spaceDown = true; e.preventDefault(); return; }
  if (e.key === 'Escape') { if (wd) finishWire(); else if (tool !== 'select') setTool('select'); else { sel = new Set(); selW = null; refresh(); } return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelection(); return; }
  const k = e.key.toLowerCase();
  if (k === 'r') { if (tool === 'place' && placing) { if (termsOf(placing.t).length === 2) placing.rot = ((placing.rot || 0) + 90) % 360; drawEd(); } else if (sel.size) { snapshot(); rotateParts(S, sel); refresh(); } return; }
  if (k === 'v') setTool('select'); if (k === 'w') setTool('wire'); if (k === 'l') setTool('rung'); if (k === 'n') setTool('note');
  const mv = { arrowleft: [-G, 0], arrowright: [G, 0], arrowup: [0, -G], arrowdown: [0, G] }[k];
  if (mv && sel.size) { e.preventDefault(); snapshot(); moveItems(S, sel, ...mv); tidy(S); refresh(); }
});
document.addEventListener('keyup', e => { if (e.key === ' ') spaceDown = false; });

/* ---------- starting up ---------- */
function start() {
  try { const sv = JSON.parse(localStorage.getItem(SHOWKEY) || 'null'); if (sv) SHOW = { ...SHOW, ...sv }; } catch (_) {}
  $('show-wn').checked = SHOW.wn; $('show-rn').checked = SHOW.rn; $('show-xr').checked = SHOW.xr;
  let d = null; try { d = JSON.parse(localStorage.getItem(AUTOSAVE) || 'null'); } catch (_) {}
  try { if (d) loadDoc(d); else loadDoc(template('starter')); } catch (_) { loadDoc(template('blank')); }
  try { const z = parseFloat(localStorage.getItem(UIKEY)); if (z) setUiSize(z); } catch (_) {}
  $('ui-size').addEventListener('change', e => setUiSize(parseFloat(e.target.value)));
  buildPalette(); refresh(true); setTool('select'); requestAnimationFrame(fitZoom);
}
start();
</script>
</body>
